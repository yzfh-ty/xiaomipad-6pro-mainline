name: System image
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'HTTPS direct link to the exact pinned OS4.0.2.5 liuqin 2in1 ZIP (use a link valid long enough for runner setup)'
        type: string
        required: true
      ubuntu_url:
        description: 'Optional mirror URL of the exact pinned Ubuntu 26.04 ARM64 desktop ISO'
        type: string
        required: false
      kernel_repository:
        description: 'Optional owner/repo; empty uses your-owner/linux-sm8450-liuqin'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: liuqin-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    # Manual trusted-branch build. Never run privileged assembly on PR code.
    runs-on: ${{ vars.LIUQIN_IMAGE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
          fetch-depth: 0
      - name: Reclaim space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h "$GITHUB_WORKSPACE"
      - name: Check disk budget and cache exact OS4 ZIP
        working-directory: project
        env:
          ANDROID_ROM_URL: ${{ inputs.rom_url }}
        run: |
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n1)
          if (( available < 45 * 1024 * 1024 * 1024 )); then
            echo '::error::Need at least 45 GiB free. Set LIUQIN_IMAGE_RUNNER to a larger x86-64 runner label.'
            exit 1
          fi
          python3 - <<'PY'
          import os
          url = os.environ['ANDROID_ROM_URL']
          if any(ord(c) < 32 for c in url):
              raise SystemExit('ROM URL contains control characters')
          print('::add-mask::' + url.replace('%', '%25'))
          PY
          python3 -u tools/prepare-ci-inputs.py --download-only
      - name: Dependencies and disk budget
        run: |
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu \
            ccache kmod rsync python3 python3-lz4 python3-zstandard python3-pyelftools git curl ca-certificates \
            xz-utils zstd lz4 file cpio busybox-static p7zip-full squashfs-tools \
            erofs-utils qemu-user qemu-user-static binfmt-support \
            gdisk e2fsprogs dosfstools util-linux acl attr m4 alsa-utils \
            dpkg-dev patch pkg-config zip libqrtr-glib-dev
          # Use the interpreter that owns the apt-installed Python modules.
          echo '/usr/bin' >> "$GITHUB_PATH"
          /usr/bin/python3 -c 'import lz4.block, zstandard, elftools; print("Python build dependencies available")'
          sudo update-binfmts --enable qemu-aarch64
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE/project"
      - name: CI syntax and ROM regression checks
        working-directory: project
        run: |
          python3 - <<'PY'
          import ast, subprocess
          from pathlib import Path
          for path in Path('tools').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          for path in Path('tools').rglob('*.sh'):
              subprocess.run(['sh', '-n', str(path)], check=True)
          PY
          python3 tests/rom-inputs.py
          python3 tests/rom-archive.py
          python3 tests/installer.py
          python3 tests/installer-layout.py
          python3 tools/patch-android-boot-ksu.py --selftest
      - name: Check runner QRTR transport before preparing Ubuntu
        run: |
          if ! sudo modprobe qrtr; then
            extra_modules="linux-modules-extra-$(uname -r)"
            if apt-cache show "$extra_modules" >/dev/null 2>&1; then
              sudo apt-get install --no-install-recommends -y "$extra_modules"
              sudo modprobe qrtr
            else
              echo 'No extra module package for this kernel; the transport probe will report whether QRTR is usable.'
            fi
          fi
          gcc -Wall -Wextra -Werror project/tests/qrtr-probe.c \
            -o "$RUNNER_TEMP/liuqin-qrtr-probe" $(pkg-config --cflags --libs qrtr-glib)
          sudo timeout 15s "$RUNNER_TEMP/liuqin-qrtr-probe"
      - name: Kernel revision
        id: kernel
        run: |
          python3 - <<'PY'
          import json, os
          sha = json.load(open('project/kernel/source.json'))['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repository || format('{0}/linux-sm8450-liuqin', github.repository_owner) }}
          ref: ${{ steps.kernel.outputs.sha }}
          path: linux-sm8450-liuqin
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare OS4, KernelSU, Ubuntu and device components
        working-directory: project
        env:
          UBUNTU_DESKTOP_URL: ${{ inputs.ubuntu_url }}
          ANDROID_ROM_URL: ${{ inputs.rom_url }}
        run: |
          mkdir -p logs
          python3 -u tools/prepare-ci-inputs.py 2>&1 | tee logs/prepare-inputs.log
      - name: Build matching kernel
        working-directory: project
        env:
          CCACHE_MAXSIZE: 2G
        run: python3 -u tools/build-liuqin-kernel.py --jobs 4 2>&1 | tee logs/kernel.log
      - name: Assemble and verify candidate
        working-directory: project
        run: |
          sudo -n python3 -u tools/build-liuqin-image.py \
            --inputs out/image-inputs.local.json --kernel-out out/kernel 2>&1 | tee logs/image.log
          python3 tools/install-liuqin.py --bundle out/image/bundle --check
          sudo chown -R "$(id -u):$(id -g)" out/image/bundle out/android-os4
          cp tools/lib/liuqin-rom-images.json out/android-os4/
          cat > out/android-os4/README.txt <<'EOF'
          Experimental OS4.0.2.5.XMYCNXM / Android 17 port candidate; not device-tested.
          boot-ksu.img is made from boot_official.img, preserving the package's custom kernel.
          KernelSU is the original pinned v3.3.0 LKM path; its loading on this kernel needs device verification.
          boot-ksu.img is the Android override (--android-boot), NOT the Ubuntu boot image.
          Run bundle/prepare-rom.py on the unchanged original ZIP to prepare --rom-dir.
          Do not run the ROM's bundled Windows or recovery flashing scripts.
          EOF
          echo 'OS4 + KernelSU candidate assembled; OFFLINE_ASSEMBLED, not device-tested.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-os4-candidate-${{ github.run_id }}
          if-no-files-found: error
          compression-level: 0
          path: project/out/image/bundle/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-os4-android-boot-${{ github.run_id }}
          if-no-files-found: error
          compression-level: 0
          path: project/out/android-os4/
          retention-days: 7
      - name: Preserve logs and input identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-os4-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            project/logs/
            project/out/stock-rom-verified.json
            project/out/kernel/build-info.json
            project/out/prepared-inputs/sensors/artifacts/*.log
          retention-days: 7
